openapi: 3.0.3
info:
  title: Currency Rates Ingestion API
  version: 1.0.0
  description: AUTO-GENERATED из model/pim.yaml (generator/generate.py).
paths:
  /v1/sources/{source}/batches/{batch_key}:
    put:
      operationId: submitBatch
      summary: Источник передаёт пакет курсов.
      parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
      - name: batch_key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitBatchRequest'
      responses:
        '201':
          description: Пакет принят впервые
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '200':
          description: 'Повтор: тот же ключ и то же содержимое, данные не изменены'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '409':
          description: Тот же ключ, но другое содержимое
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Тело или параметры не соответствуют схеме
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/rates/{base_currency}/{quote_currency}:
    get:
      operationId: getRate
      summary: Потребитель запрашивает курс на дату.
      parameters:
      - name: base_currency
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: quote_currency
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: rate_date
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Курс найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rate'
        '404':
          description: Курса на эту дату нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Параметры не соответствуют схеме
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    RateRow:
      type: object
      required:
      - base_currency
      - quote_currency
      - rate_date
      - rate
      properties:
        base_currency:
          type: string
        quote_currency:
          type: string
        rate_date:
          type: string
          format: date
        rate:
          type: string
          format: decimal
    Issue:
      type: object
      required:
      - row_number
      - reason
      properties:
        row_number:
          type: integer
        reason:
          type: string
    BatchResult:
      type: object
      required:
      - batch_key
      - status
      - row_count
      - issues
      properties:
        batch_key:
          type: string
        status:
          type: string
          enum:
          - accepted
          - rejected
        row_count:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    Rate:
      type: object
      required:
      - base_currency
      - quote_currency
      - rate_date
      - rate
      - source
      properties:
        base_currency:
          type: string
        quote_currency:
          type: string
        rate_date:
          type: string
          format: date
        rate:
          type: string
          format: decimal
        source:
          type: string
    SubmitBatchRequest:
      type: object
      required:
      - rates
      properties:
        rates:
          type: array
          items:
            $ref: '#/components/schemas/RateRow'
    Error:
      type: object
      properties:
        detail:
          description: Описание ошибки
